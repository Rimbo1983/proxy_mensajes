<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin Proxy</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .row { margin-bottom: 12px; }
    input { width: 200px; margin-right: 8px; }
  </style>
</head>
<body>
  <h2>Admin Proxy – Bloquear / Desbloquear</h2>
  <div class="row">
    <input id="blockUser" placeholder="Usuario a bloquear" />
    <button onclick="doBlock()">Bloquear</button>
  </div>
  <div class="row">
    <input id="unblockUser" placeholder="Usuario a desbloquear" />
    <button onclick="doUnblock()">Desbloquear</button>
  </div>
  <script>
    async function doBlock() {
      const u = document.getElementById('blockUser').value.trim();
      if (!u) return alert('Pon un usuario');
      const res = await fetch('/block', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ usuario: u })
      });
      alert('Bloquear → ' + await res.text());
    }
    async function doUnblock() {
      const u = document.getElementById('unblockUser').value.trim();
      if (!u) return alert('Pon un usuario');
      const res = await fetch('/unblock', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ usuario: u })
      });
      alert('Desbloquear → ' + await res.text());
    }
  </script>
</body>
</html>
